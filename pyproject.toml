[tool.ruff]
exclude = [
    ".tox",
    ".git",
    "*/migrations/*",
    "*/static/CACHE/*",
    "docs",
    "node_modules",
    "venv",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".mypy_cache",
    ".vscode",
    ".ruff_cache",
    ".ipython",
]
line-length = 80
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["I", "F401", "F811"]
ignore = ["E", "W", "C", "N"]  # Ignore most checks
fixable = ["I"]
unfixable = ["F401"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"*/apps.py" = ["F401"]
"*/celery_app.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
